<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平安夜 · 圣诞树 v17.6</title>
<meta name="description" content="一棵可以拖动、可以许愿的雪夜圣诞树。">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1512'/%3E%3Cpath d='M16 4l7 11h-4l5 8H8l5-8h-4z' fill='%232c6450'/%3E%3Crect x='14.5' y='22' width='3' height='5' fill='%235d3f26'/%3E%3Ccircle cx='16' cy='4' r='2' fill='%23f0c37a'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#f3ebd9;
    --ink-dim:rgba(243,235,217,.56);
    --line:rgba(224,204,170,.22);
    --gold:#e7b56c;
    --panel:#0b1714;
    --panel-line:#2c3b34;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#050c0a;color:var(--ink);overflow:hidden}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
  #scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #scene.dragging{cursor:grabbing}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 100% at 50% 45%,transparent 42%,rgba(3,8,6,.5) 100%)}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='n' opacity='0.65'/></svg>")}

  .plate{position:fixed;left:clamp(22px,4.5vw,60px);bottom:clamp(24px,5vh,54px);max-width:min(44vw,340px);z-index:3}
  .plate h1{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.1;letter-spacing:.08em;margin:0;color:#f6efdf;text-shadow:0 2px 18px rgba(0,0,0,.55)}
  .plate .rule{width:38px;height:1px;margin:14px 0 12px;background:linear-gradient(90deg,rgba(231,181,108,.9),rgba(231,181,108,0))}
  .plate p{margin:0;font-size:13px;line-height:1.85;color:var(--ink-dim);letter-spacing:.02em}
  .plate .latin{margin-top:12px;font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-style:italic;font-size:12px;letter-spacing:.05em;color:rgba(231,181,108,.62)}

  .ver{position:fixed;right:clamp(20px,3vw,42px);top:clamp(18px,3vh,34px);font-size:10px;letter-spacing:.22em;color:rgba(228,214,188,.32);z-index:3}

  .rail{position:fixed;right:clamp(18px,3vw,42px);bottom:clamp(24px,5vh,54px);display:flex;flex-direction:column;gap:10px;z-index:5}
  .rail button{
    display:flex;align-items:center;gap:9px;
    width:auto;min-width:52px;height:52px;padding:0 15px 0 14px;
    background:rgba(9,20,17,.82);border:1px solid rgba(203,184,150,.26);border-radius:10px;
    color:rgba(243,235,217,.86);font-size:12px;letter-spacing:.08em;font-family:inherit;
    cursor:pointer;transition:border-color .18s ease,background .18s ease,color .18s ease;
  }
  .rail button:hover{border-color:rgba(231,181,108,.55);background:rgba(14,30,25,.9);color:#fdf5e4}
  .rail button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .rail button svg{width:18px;height:18px;flex:none;color:var(--gold)}
  .rail .lbl{white-space:nowrap}

  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:rgba(230,221,203,.5);z-index:2;transition:opacity 1.2s ease;pointer-events:none;white-space:nowrap}
  .hint.off{opacity:0}

  .sheet{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(3,9,7,.74);opacity:0;pointer-events:none;transition:opacity .22s ease}
  .sheet.open{opacity:1;pointer-events:auto}
  .card{width:min(92vw,376px);background:var(--panel);border:1px solid var(--panel-line);padding:26px 24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .card h2{font-family:"Noto Serif SC","Songti SC",serif;font-weight:600;font-size:21px;letter-spacing:.1em;margin:0 0 8px;color:#f6efdf}
  .card .tip{margin:0 0 20px;font-size:12px;line-height:1.8;color:rgba(236,228,211,.55)}
  .card input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(203,184,150,.34);color:#f6efdf;font-size:16px;font-family:inherit;padding:9px 2px 10px;outline:none;letter-spacing:.04em}
  .card input:focus{border-bottom-color:var(--gold)}
  .card input::placeholder{color:rgba(236,228,211,.32)}
  .card .row{display:flex;gap:10px;margin-top:22px}
  .card .row button{flex:1;height:42px;font-family:inherit;font-size:13px;letter-spacing:.14em;cursor:pointer;border-radius:4px;transition:background .18s ease,border-color .18s ease}
  .card .ghost{background:transparent;border:1px solid rgba(203,184,150,.28);color:rgba(243,235,217,.7)}
  .card .ghost:hover{border-color:rgba(203,184,150,.55)}
  .card .solid{background:#c99a54;border:1px solid #d7a965;color:#1a1206}
  .card .solid:hover{background:#d8a960}
  .card .count{margin:16px 0 0;font-size:11px;letter-spacing:.06em;color:rgba(231,181,108,.55)}
  .card .err{margin:10px 0 0;font-size:11px;color:#e08a72;min-height:14px}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  @media (max-width:767px){
    .plate{left:20px;top:22px;bottom:auto;max-width:74vw}
    .plate h1{font-size:27px}
    .plate .rule{margin:10px 0 8px}
    .plate p{font-size:12px;line-height:1.7}
    .plate .latin{display:none}
    .rail{flex-direction:row;right:auto;left:50%;transform:translateX(-50%);bottom:16px;gap:8px}
    .rail button{min-width:0;width:54px;height:50px;padding:0;justify-content:center}
    .rail .lbl{display:none}
    .hint{display:none}
    .ver{display:none}
  }
  @media (max-height:620px) and (min-width:768px){
    .plate{bottom:22px}
    .rail{flex-direction:row;bottom:22px}
  }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="雪夜里的圣诞树，挂着暖色灯串与彩色装饰球，树顶有一颗星"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="plate">
  <h1>平安夜</h1>
  <div class="rule"></div>
  <p>把今年没说出口的话，挂到树上。<br>让它亮着，陪你过完这个冬天。</p>
  <p class="latin">Merry Christmas &amp; a quiet night</p>
</div>

<div class="ver">CHRISTMAS TREE · V17.6</div>

<div class="rail">
  <button id="btnWish" type="button" aria-label="许一个愿，挂到树上">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3.4l2.4 5 5.4.6-4 3.8 1.1 5.4-4.9-2.7-4.9 2.7 1.1-5.4-4-3.8 5.4-.6z"/></svg>
    <span class="lbl">许愿</span>
  </button>
  <button id="btnSound" type="button" aria-label="声音开关" aria-pressed="true">
    <svg id="icoSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9v6h3.4L12 19V5L7.4 9H4z"/><path d="M15.6 8.6a4.8 4.8 0 010 6.8"/><path d="M18 6.2a8.2 8.2 0 010 11.6"/></svg>
    <svg id="icoSoundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="display:none"><path d="M4 9v6h3.4L12 19V5L7.4 9H4z"/><path d="M16 9.6l4.6 4.8M20.6 9.6L16 14.4"/></svg>
    <span class="lbl" id="lblSound">音效</span>
  </button>
  <button id="btnSave" type="button" aria-label="把这一晚存成一张明信片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4v10M8 10.4l4 4 4-4"/><path d="M4.6 17.4v1.4a1.2 1.2 0 001.2 1.2h12.4a1.2 1.2 0 001.2-1.2v-1.4"/></svg>
    <span class="lbl">存图</span>
  </button>
</div>

<div class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点一下树，把灯点亮</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
    <h2 id="wishTitle">许一个愿</h2>
    <p class="tip">写下今晚想说的一句话，它会变成一颗暖灯，挂到这棵树上。只留在这台设备里，不会被上传。</p>
    <label class="sr-only" for="wishInput">你的愿望</label>
    <input id="wishInput" maxlength="18" type="text" autocomplete="off" placeholder="比如：家人平安，灯火常在">
    <p class="err" id="wishErr"></p>
    <div class="row">
      <button class="ghost" id="cancelWish" type="button">再想想</button>
      <button class="solid" id="sendWish" type="button">挂到树上</button>
    </div>
    <p class="count" id="wishCount">今夜已挂上 0 个愿望</p>
  </div>
</div>

<script>
(function(){
'use strict';
var cv=document.getElementById('scene');
if(!cv||!cv.getContext) return;
var ctx=cv.getContext('2d',{alpha:false});
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ 相机 ============ */
var W=800,H=600,S=220,DPR=1,horizonY=0;
var PIVOT=1.02,CAM=6.6,FOCAL=6.6;
var yaw=-0.5,yawTo=-0.5,pitch=-0.05,pitchTo=-0.05,zoom=1,zoomTo=1;
var t=0,burst=0,dragging=false,running=true,last=0,pointerStart=null;
var CY=1,SY=0,CP=1,SP=0;
var _p={x:0,y:0,d:0,k:1};

function updateCam(){
  var drift=(reduce||dragging)?0:Math.sin(t*0.22)*0.045;
  var yy=yaw+drift;
  CY=Math.cos(yy);SY=Math.sin(yy);CP=Math.cos(pitch);SP=Math.sin(pitch);
}
function proj(x,y,z,o){
  var X=x*CY-z*SY;
  var Z0=x*SY+z*CY;
  var Y0=y-PIVOT;
  var Y=Y0*CP-Z0*SP;
  var Z=Y0*SP+Z0*CP;
  var dz=CAM-Z;
  var k=(FOCAL/Math.max(dz,0.65))*zoom;
  o.x=W*0.5+X*k*S;
  o.y=H*0.5-Y*k*S;
  o.d=dz;o.k=k;
  return o;
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(320,cv.clientWidth||window.innerWidth);
  H=Math.max(320,cv.clientHeight||window.innerHeight);
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(H*0.72/2.42,W*0.86/1.85);
  draw();
}

/* ============ 树 ============ */
var TREE={base:0.0,top:2.18,R:0.90};
function coneR(y){
  var u=(y-TREE.base)/(TREE.top-TREE.base);
  if(u<0||u>1) return 0;
  var phase=u*(typeof TIER_COUNT==='number'?TIER_COUNT:11);
  var stepMod=1+0.058*(1-(phase-Math.floor(phase)));
  return TREE.R*Math.pow(1-u,0.92)*stepMod*(1+0.018*Math.sin(u*37+0.4));
}
var BAUBLES=[
  {hi:'#ffd8c6',mid:'#b23a30',lo:'#4a0f0c'},
  {hi:'#fff1cb',mid:'#d7a244',lo:'#6d420d'},
  {hi:'#fbf6ea',mid:'#d8c7a4',lo:'#7d6b4d'},
  {hi:'#cbf3e3',mid:'#2f8b70',lo:'#0b352a'},
  {hi:'#ffdcae',mid:'#df8a34',lo:'#5e2c09'}
];
var TIER_COUNT=11;
var TUFT=[];
(function(){
  var Ht=TREE.top-TREE.base;
  for(var i=0;i<TIER_COUNT;i++){
    var u1=(i+1)/TIER_COUNT;
    var yT=TREE.base+(i/TIER_COUNT)*Ht;
    var yB=TREE.base+u1*Ht;
    var n=Math.round(24+(1-u1)*12);
    for(var j=0;j<n;j++){
      TUFT.push({
        tier:i,
        y:yT+0.015+(yB-yT-0.04)*(((j*7+i*5)%n)/(n-1)),
        a:(j/n)*Math.PI*2+i*0.72+(Math.random()-0.5)*0.24,
        len:0.05+Math.random()*0.045,
        snow:Math.random()<0.24
      });
    }
  }
})();
var baubles=[];
(function(){
  for(var i=0;i<44;i++){
    var ti=1+Math.floor(Math.random()*(TIER_COUNT-1));
    var y=TREE.base+((ti+1)/TIER_COUNT)*(TREE.top-TREE.base)-0.030-Math.random()*0.02;
    var a=Math.random()*Math.PI*2;
    var r=coneR(y)*(0.80+Math.random()*0.16);
    baubles.push({y:y,a:a,r:r,size:0.030+Math.random()*0.022,c:i%5,ph:Math.random()*6.283});
  }
})();

var lights=[];
(function(){
  for(var s=0;s<4;s++){
    var N=52;
    for(var i=0;i<N;i++){
      var q=i/(N-1);
      lights.push({
        y:0.18+q*1.96,
        a:q*Math.PI*7.2+s*1.57+0.4,
        ph:Math.random()*6.283,
        sp:1.2+Math.random()*2.0,
        c:s===1?1:(i%5===0?2:0)
      });
    }
  }
})();

/* ============ 礼物 ============ */
var GIFTS=[
  {x:-0.80,z:0.52,w:0.30,h:0.22,d:0.26,c:0},
  {x:0.70,z:0.50,w:0.32,h:0.24,d:0.28,c:1},
  {x:0.06,z:1.12,w:0.24,h:0.18,d:0.20,c:2},
  {x:1.02,z:0.00,w:0.22,h:0.17,d:0.20,c:3}
];
var GIFT_COLORS=[
  {f:'#7d2620',t:'#9c3730',s:'#5c1a15',r:'#e6c78c'},
  {f:'#c3a874',t:'#d9c193',s:'#a48c5e',r:'#8d2f27'},
  {f:'#204a39',t:'#2d6550',s:'#173528',r:'#d9b978'},
  {f:'#966824',t:'#b5853a',s:'#71501c',r:'#efe3cb'}
];

/* ============ 雪 ============ */
var flakes=[];
(function(){
  for(var i=0;i<330;i++){
    flakes.push({
      x:Math.random(),y:Math.random(),
      d:Math.random(),r:0.9+Math.random()*3.2,
      sp:0.04+Math.random()*0.11,
      ph:Math.random()*6.283,
      dr:0.3+Math.random()*0.9
    });
  }
})();
var stars=[];
(function(){
  for(var i=0;i<120;i++){
    stars.push({x:Math.random()*0.94+0.03,y:Math.random()*0.56+0.03,r:0.6+Math.random()*1.3,ph:Math.random()*6.283});
  }
})();
var bokeh=[];
(function(){
  for(var i=0;i<6;i++){
    bokeh.push({x:Math.random()*0.9+0.05,y:0.78+Math.random()*0.24,r:26+Math.random()*54,ph:Math.random()*6.283,w:Math.random()<0.5});
  }
})();

/* ============ 光晕贴图 ============ */
function makeGlow(r,g,b){
  var s=64,c=document.createElement('canvas');
  c.width=c.height=s;
  var x=c.getContext('2d');
  var gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)');
  gr.addColorStop(0.16,'rgba('+r+','+g+','+b+',0.62)');
  gr.addColorStop(0.42,'rgba('+r+','+g+','+b+',0.18)');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=gr;x.fillRect(0,0,s,s);
  return c;
}
var GLOW={
  warm:makeGlow(255,176,92),
  cream:makeGlow(255,228,176),
  ember:makeGlow(255,130,84),
  pale:makeGlow(220,238,236)
};
var SNOW=makeGlow(226,240,238);

/* ============ 绘制：天空 ============ */
function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H*0.82);
  g.addColorStop(0,'#040b09');
  g.addColorStop(0.42,'#081512');
  g.addColorStop(0.78,'#0d2019');
  g.addColorStop(1,'#14291f');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  var mx=W*0.82,my=H*0.15;
  var m=ctx.createRadialGradient(mx,my,0,mx,my,H*0.48);
  m.addColorStop(0,'rgba(228,236,208,0.11)');
  m.addColorStop(0.4,'rgba(200,224,204,0.05)');
  m.addColorStop(1,'rgba(180,210,200,0)');
  ctx.fillStyle=m;
  ctx.fillRect(0,0,W,H);

  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    var tw=reduce?0.7:(0.45+0.45*Math.sin(t*0.9+s.ph));
    ctx.globalAlpha=tw*0.7;
    ctx.fillStyle='#dfeae0';
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,6.283);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawDistantPines(){
  var gy=horizonY;
  var cols=['rgba(8,17,14,0.9)','rgba(9,19,15,0.82)','rgba(10,21,17,0.75)'];
  var items=[
    {x:0.08,h:0.13},{x:0.15,h:0.09},{x:0.22,h:0.16},
    {x:0.88,h:0.12},{x:0.81,h:0.08},{x:0.94,h:0.15}
  ];
  for(var i=0;i<items.length;i++){
    var it=items[i],h=it.h*H,x=it.x*W,col=cols[i%3];
    ctx.fillStyle=col;
    for(var k=0;k<3;k++){
      var w=h*(0.40-k*0.10);
      var baseY=gy-h*k*0.26;
      var hh=h*0.5;
      ctx.beginPath();
      ctx.moveTo(x,baseY-hh);
      ctx.lineTo(x+w,baseY);
      ctx.lineTo(x-w,baseY);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* ============ 绘制：雪地 ============ */
function drawGround(gy){
  var g=ctx.createLinearGradient(0,gy-10,0,H);
  g.addColorStop(0,'#15261f');
  g.addColorStop(0.24,'#23362e');
  g.addColorStop(0.58,'#35483f');
  g.addColorStop(1,'#4a5d53');
  ctx.fillStyle=g;
  ctx.fillRect(0,gy-10,W,H-gy+10);

  var cx=W*0.5;
  var pool=ctx.createRadialGradient(cx,gy+S*0.06,0,cx,gy+S*0.06,S*2.5);
  pool.addColorStop(0,'rgba(255,184,112,0.16)');
  pool.addColorStop(0.34,'rgba(255,164,92,0.08)');
  pool.addColorStop(0.7,'rgba(236,150,96,0.025)');
  pool.addColorStop(1,'rgba(230,140,90,0)');
  ctx.fillStyle=pool;
  ctx.fillRect(0,gy-40,W,H-gy+40);

  ctx.save();
  ctx.translate(cx,gy+S*0.10);
  ctx.scale(1,0.34);
  var mg=ctx.createRadialGradient(0,0,0,0,0,S*0.95);
  mg.addColorStop(0,'rgba(200,216,206,0.15)');
  mg.addColorStop(0.55,'rgba(184,204,192,0.06)');
  mg.addColorStop(1,'rgba(176,196,184,0)');
  ctx.fillStyle=mg;
  ctx.beginPath();ctx.arc(0,0,S*0.95,0,6.283);ctx.fill();
  ctx.restore();

  ctx.globalAlpha=0.055;
  ctx.fillStyle='#dfe9e2';
  var drifts=[[0.18,1.9],[0.62,2.6],[0.42,1.2]];
  for(var i=0;i<drifts.length;i++){
    ctx.beginPath();
    ctx.ellipse(W*drifts[i][0],gy+S*0.5*i,S*drifts[i][1],S*0.2,0,0,6.283);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  var hz=ctx.createLinearGradient(0,gy-18,0,gy+34);
  hz.addColorStop(0,'rgba(190,214,200,0)');
  hz.addColorStop(0.55,'rgba(190,214,200,0.07)');
  hz.addColorStop(1,'rgba(190,214,200,0)');
  ctx.fillStyle=hz;
  ctx.fillRect(0,gy-18,W,52);
}

function drawContactShadow(gy){

/* ============ 绘制：树 ============ */
function drawTrunk(){
  var pts=[[-0.055,0],[0.055,0],[0.042,0.62],[-0.042,0.62]];
  var arr=[],o={x:0,y:0,d:0,k:1};
  for(var i=0;i<pts.length;i++){
    proj(pts[i][0],pts[i][1],0,o);
    arr.push(o.x,o.y);
  }
  ctx.fillStyle='#2a1c13';
  ctx.beginPath();
  ctx.moveTo(arr[0],arr[1]);
  for(var j=2;j<arr.length;j+=2) ctx.lineTo(arr[j],arr[j+1]);
  ctx.closePath();
  ctx.fill();
}

function drawTree(){
  var o={x:0,y:0,d:0,k:1};
  var Ht=TREE.top-TREE.base,steps=62,i,u,y,r,m,phi;

  proj(0,TREE.base+0.02,0,o); var sBot=o.y;
  proj(0,TREE.top,0,o); var sTop=o.y;
  proj(-TREE.R,TREE.base+0.25,0,o); var sL=o.x;
  proj(TREE.R,TREE.base+0.25,0,o); var sR=o.x;

  var pts=[];
  for(i=0;i<=steps;i++){
    u=i/steps;
    y=TREE.top-u*Ht;
    r=coneR(y)*(1+0.028*Math.sin(u*23+0.7));
    if(r<0.004) r=0.004;
    proj(-r,y,0,o); pts.push(o.x,o.y);
  }
  for(i=steps;i>=0;i--){
    u=i/steps;
    y=TREE.top-u*Ht;
    r=coneR(y)*(1+0.028*Math.sin(u*23+2.5));
    if(r<0.004) r=0.004;
    proj(r,y,0,o); pts.push(o.x,o.y);
  }

  var g=ctx.createLinearGradient(sL,0,sR,0);
  g.addColorStop(0,'#2c6249');
  g.addColorStop(0.18,'#214c37');
  g.addColorStop(0.46,'#173929');
  g.addColorStop(0.72,'#0d261b');
  g.addColorStop(1,'#04110c');
  ctx.beginPath();
  ctx.moveTo(pts[0],pts[1]);
  for(i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();
  ctx.fillStyle=g;
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0],pts[1]);
  for(i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath();
  ctx.clip();

  var hx=sL+(sR-sL)*0.26, hy=(sTop+sBot)*0.52;
  var rg=ctx.createRadialGradient(hx,hy,0,hx,hy,Math.max(24,(sR-sL)*0.5));
  rg.addColorStop(0,'rgba(170,215,190,0.13)');
  rg.addColorStop(0.55,'rgba(150,205,172,0.04)');
  rg.addColorStop(1,'rgba(140,200,170,0)');
  ctx.fillStyle=rg;
  ctx.fillRect(sL-2,sTop-2,(sR-sL)+4,(sBot-sTop)+4);

  ctx.globalCompositeOperation='lighter';
  var wpx=sL+(sR-sL)*0.5, wpy=sBot-0.56*(sBot-sTop);
  var wg=ctx.createRadialGradient(wpx,wpy,0,wpx,wpy,Math.max(30,(sR-sL)*0.42));
  wg.addColorStop(0,'rgba(255,186,110,0.10)');
  wg.addColorStop(0.6,'rgba(255,170,90,0.035)');
  wg.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=wg;
  ctx.fillRect(sL-2,sTop-2,(sR-sL)+4,(sBot-sTop)+4);
  ctx.globalCompositeOperation='source-over';

  var bg=ctx.createLinearGradient(0,sBot,0,sBot-S*0.95);
  bg.addColorStop(0,'rgba(3,9,7,0.40)');
  bg.addColorStop(0.55,'rgba(3,9,7,0.12)');
  bg.addColorStop(1,'rgba(3,9,7,0)');
  ctx.fillStyle=bg;
  ctx.fillRect(sL-2,sTop-2,(sR-sL)+4,(sBot-sTop)+4);
  ctx.restore();

  for(i=1;i<TIER_COUNT;i++){
    y=TREE.base+(i/TIER_COUNT)*Ht;
    r=coneR(y);
    if(r<0.035) continue;
    var arc=[];
    for(m=0;m<=16;m++){
      phi=(m/16)*Math.PI;
      proj(Math.cos(phi)*r,y-0.006,Math.sin(phi)*r,o);
      arc.push(o.x,o.y);
    }
    ctx.beginPath();
    ctx.moveTo(arc[0],arc[1]);
    for(m=2;m<arc.length;m+=2) ctx.lineTo(arc[m],arc[m+1]);
    ctx.strokeStyle='rgba(4,14,10,0.055)';
    ctx.lineWidth=12;
    ctx.stroke();
    ctx.strokeStyle='rgba(4,14,10,0.055)';
    ctx.lineWidth=5;
    ctx.stroke();
    ctx.strokeStyle='rgba(4,14,10,0.07)';
    ctx.lineWidth=1.8;
    ctx.stroke();
  }

  for(i=0;i<=110;i++){
    var q=i/110;
    y=TREE.base+0.05+q*(Ht-0.10);
    r=coneR(y);
    if(r<0.05) continue;
    var ph=q*TIER_COUNT, frac=ph-Math.floor(ph);
    var len=0.008+0.026*(1-frac)*(1-frac);
    var drop=0.010+0.030*(1-frac);
    var side, sgn, lit;
    for(side=0;side<2;side++){
      sgn=side?-1:1;
      lit=side?0.15:0.9;
      ctx.strokeStyle='hsl(151,28%,'+(9+9*lit+3*(1-q)).toFixed(1)+'%)';
      ctx.lineWidth=Math.max(1,S*0.004);
      proj(sgn*r*0.93,y,0.04,o);
      var ex=o.x,ey=o.y;
      proj(sgn*(r+len*(1+0.15*Math.sin(i*1.9))),y-drop,0.04,o);
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(o.x,o.y);ctx.stroke();
    }
  }
}

function drawBaubles(){
  var arr=[],o={x:0,y:0,d:0,k:1};
  for(var i=0;i<baubles.length;i++){
    var b=baubles[i];
    proj(Math.cos(b.a)*b.r,b.y,Math.sin(b.a)*b.r,o);
    if(Math.sin(b.a+yaw)<-0.12) continue;
    arr.push({x:o.x,y:o.y,k:o.k,d:o.d,b:b});
  }
  arr.sort(function(A,B){return B.d-A.d;});
  var o2={x:0,y:0,d:0,k:1};
  for(var n=0;n<arr.length;n++){
    var it=arr[n],b=it.b,col=BAUBLES[b.c];
    var rad=Math.max(2.2,b.size*S*it.k);
    var depthFade=Math.min(1,0.55+0.45*(1-(it.d-4.6)/2.2));
    ctx.globalAlpha=depthFade;

    proj(Math.cos(b.a)*b.r,b.y+0.055,Math.sin(b.a)*b.r,o2);
    ctx.strokeStyle='rgba(226,208,176,0.3)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(o2.x,o2.y);ctx.lineTo(it.x,it.y);ctx.stroke();

    var g=ctx.createRadialGradient(it.x-rad*0.34,it.y-rad*0.4,rad*0.08,it.x,it.y,rad);
    g.addColorStop(0,col.hi);
    g.addColorStop(0.38,col.mid);
    g.addColorStop(0.85,col.lo);
    g.addColorStop(1,'#120a08');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(it.x,it.y,rad,0,6.283);ctx.fill();

    ctx.fillStyle='rgba(255,248,232,0.85)';
    ctx.beginPath();ctx.arc(it.x-rad*0.36,it.y-rad*0.42,rad*0.24,0,6.283);ctx.fill();

    ctx.strokeStyle='rgba(255,206,150,0.24)';
    ctx.lineWidth=Math.max(0.8,rad*0.08);
    ctx.beginPath();ctx.arc(it.x,it.y,rad*0.94,0.35,1.55);ctx.stroke();
    ctx.globalAlpha=1;
  }
}

function drawLights(){
  ctx.globalCompositeOperation='lighter';
  var o={x:0,y:0,d:0,k:1};
  var sprites=[GLOW.warm,GLOW.cream,GLOW.ember];
  for(var i=0;i<lights.length;i++){
    var L=lights[i];
    var r=coneR(L.y)*1.02+0.006;
    proj(Math.cos(L.a)*r,L.y,Math.sin(L.a)*r,o);
    var front=Math.sin(L.a+yaw);
    var tw=reduce?0.55:(0.52+0.48*Math.sin(t*L.sp+L.ph));
    var wave=0;
    if(burst>0){
      var d=(L.y-(1.0+(1-burst)*1.5))/0.16;
      wave=Math.exp(-d*d)*burst*1.0;
    }
    var alpha=(front<0?0.16:0.72)*tw+wave*0.5;
    if(alpha<=0.02) continue;
    ctx.globalAlpha=Math.min(1,alpha);
    var rad=(0.052+0.030*tw)*S*o.k;
    var spr=sprites[L.c];
    ctx.drawImage(spr,o.x-rad,o.y-rad,rad*2,rad*2);
    ctx.globalAlpha=Math.min(1,alpha*1.1);
    ctx.filter='none';
    ctx.fillStyle='#fff4dc';
    ctx.beginPath();
    ctx.arc(o.x,o.y,Math.max(1.1,S*0.0036),0,6.283);
    ctx.fill();
    ctx.globalAlpha=Math.min(1,alpha*0.85);
    ctx.drawImage(spr,o.x-rad*0.3,o.y-rad*0.3,rad*0.6,rad*0.6);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

function drawStar(){
  var y=TREE.top+0.10;
  proj(0,y,0,_p);
  var rad=S*0.10*_p.k, cx=_p.x, cy=_p.y;
  var pulse=reduce?0.5:(0.5+0.5*Math.sin(t*0.9));

  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.55+0.2*pulse;
  var gr=rad*4.2;
  ctx.drawImage(GLOW.cream,cx-gr,cy-gr,gr*2,gr*2);

  ctx.globalAlpha=0.30+0.18*pulse;
  ctx.strokeStyle='rgba(255,226,170,0.7)';
  ctx.lineWidth=Math.max(1,rad*0.08);
  for(var i=0;i<4;i++){
    var a=i*Math.PI/2+0.4;
    var len=rad*(2.2+0.5*pulse);
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*rad*0.9,cy+Math.sin(a)*rad*0.9);
    ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;

  var body=ctx.createLinearGradient(cx,cy-rad,cx,cy+rad);
  body.addColorStop(0,'#fff6dc');
  body.addColorStop(0.55,'#f3c877');
  body.addColorStop(1,'#c98d3e');
  ctx.fillStyle=body;
  ctx.beginPath();
  for(var k=0;k<10;k++){
    var ang=-Math.PI/2+k*Math.PI/5;
    var rr=(k%2?rad*0.42:rad);
    var px=cx+Math.cos(ang)*rr, py=cy+Math.sin(ang)*rr;
    if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
}

/* ============ 绘制：礼物 ============ */
function drawGifts(){
  var arr=[],o={x:0,y:0,d:0,k:1};
  for(var i=0;i<GIFTS.length;i++){
    var g=GIFTS[i];
    proj(g.x,g.h/2,g.z,o);
    arr.push({x:o.x,y:o.y,k:o.k,d:o.d,g:g});
  }
  arr.sort(function(A,B){return B.d-A.d;});
  for(var n=0;n<arr.length;n++){
    var it=arr[n],g=it.g,c=GIFT_COLORS[g.c];
    var w=g.w*S*it.k, h=g.h*S*it.k, dp=g.d*S*it.k*0.5;
    var cx=it.x, cy=it.y+h/2;

    ctx.save();
    ctx.translate(cx,cy+h*0.04);
    ctx.scale(1,0.3);
    var sg=ctx.createRadialGradient(0,0,0,0,0,w*0.7);
    sg.addColorStop(0,'rgba(3,9,7,0.46)');
    sg.addColorStop(1,'rgba(3,9,7,0)');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.arc(0,0,w*0.7,0,6.283);ctx.fill();
    ctx.restore();

    var topOffX=-dp*0.35, topOffY=-dp*0.6;

    ctx.fillStyle=c.s;
    ctx.beginPath();
    ctx.moveTo(cx-w/2,cy-h);
    ctx.lineTo(cx-w/2+topOffX,cy-h+topOffY);
    ctx.lineTo(cx-w/2+topOffX,cy+topOffY);
    ctx.lineTo(cx-w/2,cy);
    ctx.closePath();ctx.fill();

    ctx.fillStyle=c.t;
    ctx.beginPath();
    ctx.moveTo(cx-w/2,cy-h);
    ctx.lineTo(cx+w/2,cy-h);
    ctx.lineTo(cx+w/2+topOffX,cy-h+topOffY);
    ctx.lineTo(cx-w/2+topOffX,cy-h+topOffY);
    ctx.closePath();ctx.fill();

    var fg=ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
    fg.addColorStop(0,c.s);
    fg.addColorStop(0.45,c.f);
    fg.addColorStop(1,c.f);
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.rect(cx-w/2,cy-h,w,h);
    ctx.fill();

    ctx.fillStyle=c.r;
    ctx.fillRect(cx-w*0.075,cy-h,w*0.15,h);
    ctx.fillRect(cx-w/2,cy-h*0.62,w,h*0.14);

    ctx.beginPath();
    ctx.ellipse(cx-w*0.16,cy-h-dp*0.62,w*0.14,h*0.08,-0.4,0,6.283);
    ctx.ellipse(cx+w*0.16,cy-h-dp*0.62,w*0.14,h*0.08,0.4,0,6.283);
    ctx.fill();

    ctx.fillStyle='rgba(255,236,200,0.12)';
    ctx.fillRect(cx-w/2,cy-h,Math.max(1,w*0.04),h);
  }
}

/* ============ 愿望 ============ */
var KEY='xmas-tree-v17.6-wishes';
var wishes=[],wishBaubles=[],orbs=[];
function hashStr(s){
  var h=0;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function loadWishes(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return;
    var arr=JSON.parse(raw);
    if(!Array.isArray(arr)) return;
    wishes=arr.slice(-30);
    for(var i=0;i<wishes.length;i++){
      var txt=String(wishes[i]).slice(0,18);
      var h=hashStr(txt);
      wishBaubles.push({
        y:0.36+((h%997)/997)*1.56,
        a:((h>>3)%360)/57.2958,
        r:coneR(0.36+((h%997)/997)*1.56)*1.06,
        size:0.042,
        ph:Math.random()*6.283,
        text:txt,
        born:-10
      });
    }
  }catch(e){}
}
function saveWishes(){
  try{localStorage.setItem(KEY,JSON.stringify(wishes));}catch(e){}
}
function drawWishBaubles(){
  if(!wishBaubles.length) return;
  ctx.globalCompositeOperation='lighter';
  var o={x:0,y:0,d:0,k:1};
  for(var i=0;i<wishBaubles.length;i++){
    var b=wishBaubles[i];
    if(Math.sin(b.a+yaw)<-0.12) continue;
    var age=reduce?1:Math.min(1,(t-b.born)/0.9);
    if(age<=0) continue;
    proj(Math.cos(b.a)*b.r,b.y,Math.sin(b.a)*b.r,o);
    var rad=(0.06+0.02*Math.sin(t*1.2+b.ph))*S*o.k;
    ctx.globalAlpha=0.42*age;
    ctx.drawImage(GLOW.cream,o.x-rad*2.6,o.y-rad*2.6,rad*5.2,rad*5.2);
    ctx.globalAlpha=0.9*age;
    ctx.drawImage(GLOW.cream,o.x-rad*0.42,o.y-rad*0.42,rad*0.84,rad*0.84);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}
function updateOrbs(dt){
  if(reduce){ orbs.length=0; return; }
  for(var i=orbs.length-1;i>=0;i--){
    orbs[i].p+=dt/orbs[i].dur;
    if(orbs[i].p>=1){
      orbs[i].b.born=t;
      orbs.splice(i,1);
    }
  }
}
function drawOrbs(){
  if(!orbs.length) return;
  ctx.globalCompositeOperation='lighter';
  var o={x:0,y:0,d:0,k:1};
  for(var i=0;i<orbs.length;i++){
    var ob=orbs[i],p=ob.p, e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    var b=ob.b;
    var sy=-0.45+ (b.y+0.45)*e;
    var rr=1.15-(1.15-b.r)*e;
    var aa=b.a*e;
    proj(Math.cos(aa)*rr,sy,Math.sin(aa)*rr,o);
    var rad=(0.055+0.05*(1-p))*S*o.k;
    ctx.globalAlpha=0.85*(1-p*0.2);
    ctx.drawImage(GLOW.cream,o.x-rad*3,o.y-rad*3,rad*6,rad*6);
    ctx.globalAlpha=0.9;
    ctx.drawImage(GLOW.warm,o.x-rad*0.5,o.y-rad*0.5,rad,rad);
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
}

/* ============ 主绘制 ============ */
function draw(){
  updateCam();
  proj(0,0,0,_p);
  var gy=_p.y;
  horizonY=gy;
  drawSky();
  drawDistantPines();
  drawGround(gy);
  drawTreeAura();
  drawContactShadow(gy);
  drawTrunk();
  drawTree();
  drawGifts();
  drawBaubles();
  drawLights();
  drawWishBaubles();
  drawOrbs();
  drawStar();
  drawSnow();
  drawBokeh();
}

/* ============ 循环 ============ */
function advance(dt){
  if(!reduce) t+=dt;
  var k=reduce?1:Math.min(1,dt*7);
  yaw+=(yawTo-yaw)*k;
  pitch+=(pitchTo-pitch)*k;
  zoom+=(zoomTo-zoom)*k;
  burst=Math.max(0,burst-dt*0.85);
  if(!reduce){
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];
      f.y+=f.sp*dt;
      if(f.y>1.06){ f.y=-0.06; f.x=Math.random(); }
    }
  }
  updateOrbs(dt);
}
function tick(now){
  if(!running) return;
  if(!last) last=now;
  var dt=Math.min(0.07,(now-last)/1000);
  last=now;
  advance(dt);
  draw();
  requestAnimationFrame(tick);
}

/* ============ 交互 ============ */
var pointers=new Map();
var pinchDist=0;
function ptCount(){ return pointers.size; }
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptCount()===1){
    dragging=true;
    pointerStart={x:e.clientX,y:e.clientY,t:Date.now()};
    movedDist=0;
  }
  if(ptCount()===2){
    var a=Array.from(pointers.values());
    pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
  cv.classList.add('dragging');
  hidePulse();
});
var movedDist=0;
cv.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId)) return;
  var prev=pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptCount()===1&&dragging){
    var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    movedDist+=Math.abs(dx)+Math.abs(dy);
    yawTo+=dx*0.006;
    pitchTo+=dy*0.0022;
    if(pitchTo>0.16)pitchTo=0.16;
    if(pitchTo<-0.12)pitchTo=-0.12;
    yawTo=Math.max(-1.3,Math.min(1.3,yawTo));
    if(reduce) draw();
  }else if(ptCount()===2){
    var a=Array.from(pointers.values());
    var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchDist>0){
      zoomTo*=d/pinchDist;
      zoomTo=Math.max(0.8,Math.min(1.45,zoomTo));
    }
    pinchDist=d;
    if(reduce) draw();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(ptCount()===0){
    dragging=false;
    cv.classList.remove('dragging');
    if(pointerStart){
      var dt2=Date.now()-pointerStart.t;
      if(dt2<500&&movedDist<12) ignite();
    }
    pointerStart=null;
  }
  pinchDist=0;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',function(e){ if(e.buttons===0) endPointer(e); });
cv.addEventListener('wheel',function(e){
  e.preventDefault();
  zoomTo+=(-e.deltaY)*0.0012;
  zoomTo=Math.max(0.8,Math.min(1.45,zoomTo));
  hidePulse();
  if(reduce) draw();
},{passive:false});

function ignite(){
  burst=1;
  hidePulse();
  draw();
  chime(true);
}

/* ============ 声音 ============ */
var soundOn=true,ac=null;
function chime(soft){
  if(!soundOn) return;
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    var now=ac.currentTime;
    var base=soft?0.18:0.26;
    var notes=soft?[880,1174,1568]:[880,1108,1318,1760];
    for(var i=0;i<notes.length;i++){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';
      o.frequency.value=notes[i];
      g.gain.setValueAtTime(0,now+i*0.07);
      g.gain.linearRampToValueAtTime(base,now+i*0.07+0.015);
      g.gain.exponentialRampToValueAtTime(0.0008,now+i*0.07+0.85);
      o.connect(g);g.connect(ac.destination);
      o.start(now+i*0.07);
      o.stop(now+i*0.07+0.9);
    }
  }catch(err){}
}

/* ============ 界面 ============ */
var hint=document.getElementById('hint');
var pulseDone=false;
function hidePulse(){
  if(pulseDone||!hint) return;
  pulseDone=true;
  setTimeout(function(){ hint.classList.add('off'); },600);
}
setTimeout(hidePulse,7000);

var sheet=document.getElementById('sheet');
var wishInput=document.getElementById('wishInput');
var wishErr=document.getElementById('wishErr');
var wishCount=document.getElementById('wishCount');

function openSheet(){
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden','false');
  setTimeout(function(){ wishInput&&wishInput.focus(); },120);
}
function closeSheet(){
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
}
document.getElementById('btnWish').addEventListener('click',openSheet);
document.getElementById('cancelWish').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){ if(e.target===sheet) closeSheet(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

function addWish(text){
  text=text.trim().slice(0,18);
  if(!text){ wishErr.textContent='先写一句想说的话。'; return; }
  wishErr.textContent='';
  var h=hashStr(text);
  var yy=0.36+((h%997)/997)*1.56;
  var aa=((h>>3)%360)/57.2958;
  var b={y:yy,a:aa,r:coneR(yy)*1.06,size:0.042,ph:Math.random()*6.283,text:text,born:t};
  wishBaubles.push(b);
  if(!reduce) orbs.push({b:b,p:0,dur:1.5});
  else b.born=t-10;
  wishes.push(text);
  if(wishes.length>30) wishes.shift();
  saveWishes();
  wishCount.textContent='今夜已挂上 '+wishes.length+' 个愿望';
  wishInput.value='';
  closeSheet();
  burst=1;
  chime(false);
  draw();
}
document.getElementById('sendWish').addEventListener('click',function(){ addWish(wishInput.value); });
wishInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addWish(wishInput.value); } });

var btnSound=document.getElementById('btnSound');
var icoOn=document.getElementById('icoSoundOn');
var icoOff=document.getElementById('icoSoundOff');
var lblSound=document.getElementById('lblSound');
btnSound.addEventListener('click',function(){
  soundOn=!soundOn;
  btnSound.setAttribute('aria-pressed',soundOn?'true':'false');
  icoOn.style.display=soundOn?'':'none';
  icoOff.style.display=soundOn?'none':'';
  lblSound.textContent=soundOn?'音效':'静音';
  if(soundOn) chime(true);
});

document.getElementById('btnSave').addEventListener('click',function(){
  try{
    cv.toBlob(function(blob){
      if(!blob) return;
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      a.download='平安夜-圣诞树-v17.6.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },2500);
    },'image/png');
  }catch(err){}
});

/* ============ 启动 ============ */
loadWishes();
wishCount.textContent='今夜已挂上 '+wishes.length+' 个愿望';
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,120); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    running=false;
  }else if(!reduce){
    running=true;last=0;
    requestAnimationFrame(tick);
  }
});

resize();
if(!reduce){
  last=0;
  requestAnimationFrame(tick);
}else{
  draw();
}
window.__treeReady=true;
})();
</script>
